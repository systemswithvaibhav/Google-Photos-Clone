spring.application.name=backend
server.port=8081

# Database Connection (Docker Container Port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/google_photos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Setup
# 'update' se Spring Boot entities dekh kar DB me khud tables create/update kar dega
spring.jpa.hibernate.ddl-auto=update

# Terminal me execute hone wali SQL queries dikhengi (debugging ke liye mast hai)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Postgres dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OSIV warning band karne ke liye
spring.jpa.open-in-view=false

# ImageKit credentials (jab photos upload implement karoge tab kaam aayega)
# imagekit.public-key=your_public_key
# imagekit.private-key=your_private_key
# imagekit.url-endpoint=https://ik.imagekit.io/your_id


# JWT
app.cors.allowed-origins=http://localhost:3000
app.jwt.secret=${JWT_SECRET:your-256-bit-secret}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
